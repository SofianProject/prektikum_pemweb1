<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percobaan 3 - Format teks</title>
</head>
<body>
    <b>ini merupakan teks tebal</b>
    <i>ini merupakan teks miring</i>
    <mark>ini merupakan teks yang di highlight</mark>
    <small>ini merupakan teks kecil</small>
    <sub>ini merupakan teks subscript</sub>
    <sup>ini merupakan teks superscript</sup>
    <del>ini merupakan teks yang dihapus</del>
    <ins>ini merupakan teks yang ditambahkan</ins>
</body>
</html>
