<!DOCTYPE html>
<html>

<head>
    <title>Latihan Form</title>
</head>

<body>

    <form>

        <table>

            <tr>
                <td>Nama</td>
                <td>
                    <input type="text" value="Romi">
                </td>
            </tr>

            <tr>
                <td>Email</td>
                <td>
                    <input type="email" value="romi@gmail.com">
                </td>
            </tr>

            <tr>
                <td>Username</td>
                <td>
                    <input type="text" value="romi">
                </td>
            </tr>

            <tr>
                <td>Password</td>
                <td>
                    <input type="password">
                </td>
            </tr>

            <tr>
                <td>Jenis Kelamin</td>
                <td>
                    <select>
                        <option>Laki-Laki</option>
                        <option>Perempuan</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Alamat</td>
                <td>
                    <textarea rows="10" cols="40">Bogor</textarea>
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Simpan">
                </td>
            </tr>

        </table>

    </form>

</body>

</html>
