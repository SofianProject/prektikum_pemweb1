<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Input</title>
</head>
<body>
    <form action="#" method="POST">
        <label>Input 1:</label>
        <input type="text" value="Nilai Tetap" readonly><br><br>
        <label>Input 2:</label>
        <input type="text" maxlength="5"><br><br>
        <label>Input 3:</label>
        <input type="text" disabled><br><br>
        <label>Input 4:</label>
        <input type="text" required><br><br>
        <label>Input 5:</label>
        <input type="text" pattern="H1D025105" maxlength="9" title="masukkin nim yang bener" required><br><br>
        <input type="submit" value="Kirim">
    </form>
</body>
</html>
