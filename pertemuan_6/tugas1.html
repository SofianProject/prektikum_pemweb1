<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tugas 1 - Konversi Nilai</title>
</head>
<body>
    <h2>Konversi Nilai</h2>
    Masukkan nilai (0-100):
    <input id="nilai" type="number" min="0" max="100">
    <input type="button" value="Cek Grade" onClick="hitungGrade()">
    <p id="hasil"></p>

    <script>
        function hitungGrade() {
            const input = document.getElementById("nilai");
            const hasil = document.getElementById("hasil");

            if (input.value === "") {
                hasil.innerHTML = "Nilai harus diisi!";
                return;
            }

            const nilai = Number(input.value);
            let grade;

            if (nilai < 0 || nilai > 100) {
                hasil.innerHTML = "Nilai harus antara 0 sampai 100!";
                return;
            } else if (nilai <= 20) {
                grade = "E";
            } else if (nilai <= 40) {
                grade = "D";
            } else if (nilai <= 60) {
                grade = "C";
            } else if (nilai <= 80) {
                grade = "B";
            } else {
                grade = "A";
            }

            hasil.innerHTML = "Nilai " + nilai + " mendapat grade <b>" + grade + "</b>";
        }
    </script>
</body>
</html>
