<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percobaan 5 - List</title>
</head>
<body>
    <p>Unordered List (lingkaran)</p>
    <ul type="circle">
        <li>Sunday</li>
        <li>Monday</li>
        <li>Tuesday</li>
    </ul>
    <p>Unordered List (persegi)</p>
    <ul type="square">
        <li>Sunday</li>
        <li>Monday</li>
        <li>Tuesday</li>
    </ul>
    <p>Unordered List (angka)</p>
    <ul type="1">
        <li>Sunday</li>
        <li>Monday</li>
        <li>Tuesday</li>
    </ul>
</body>
</html>
